# maki-be's pipeline (spec, Infra & deploy): lint and test on every push and
# pull request; on main, the image to GitHub's registry, then the deploy to
# the VPS over SSH, its migrations before the new version starts.
#
# The deploy waits until the repository's DEPLOY_ENABLED variable is true;
# the production environment holds its server and secrets, and can ask for
# an approval first. docs/deployment.md sets them up.
name: maki-be

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request's older runs stop; main's run to the end, deploy included.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        # The Makefile's version.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run
      - name: The generated store code matches the queries
        run: docker run --rm -v "$PWD:/src" -w /src/sqlc sqlc/sqlc:1.31.1 diff

  test:
    runs-on: ubuntu-latest
    services:
      # The production major version (Go + Gin standard §12). Each test makes
      # its own schema in it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maki
          POSTGRES_PASSWORD: maki
          POSTGRES_DB: maki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maki -d maki"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # With CI set, the integration tests fail rather than skip without it.
      TEST_DATABASE_URL: postgres://maki:maki@localhost:5432/maki?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./...

  image:
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: The image's name
        id: name
        # A registry name is lowercase; an owner's may not be.
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/$owner/maki-be:$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$owner/maki-be:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: The server's key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  BatchMode yes\n' \
            "$HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: The stack's files
        # .env and backup.env stay on the server; only their templates go.
        run: |
          scp deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh \
            deploy/.env.example deploy/backup.env.example deploy:/srv/maki/
      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          # The job's own token, through stdin: nothing long-lived on the server.
          printf '%s' "$TOKEN" | ssh deploy "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh deploy "sh /srv/maki/deploy.sh '$IMAGE'; status=\$?; docker logout ghcr.io; exit \$status"
