# maki-be's CI/CD (spec, Infra & deploy): on every push to main, the tests,
# then the image to GitHub's registry, then the deploy to the server over
# SSH, its migrations before the new version starts.
#
# The deploy waits until the repository's DEPLOY_ENABLED variable is true;
# everything before it runs without any secret. docs/deployment.md sets the
# server and the repository's secrets up.
name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# One run at a time, in the order of the pushes, so a deploy never lands
# after a newer one; a run still waiting gives way to a newer push.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # A registry name is lowercase, as this repository's is.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The production major version (Go + Gin standard §12). Each test makes
      # its own schema in it.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: maki
          POSTGRES_PASSWORD: maki
          POSTGRES_DB: maki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maki -d maki"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # With CI set, the integration tests fail rather than skip without it.
      TEST_DATABASE_URL: postgres://maki:maki@localhost:5432/maki?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Lint
        # The Makefile's version.
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run

      - name: The generated store code matches the queries
        run: docker run --rm -v "$PWD:/src" -w /src/sqlc sqlc/sqlc:1.31.1 diff

      - name: Test
        # -count=1: setup-go restores Go's cache, test results included, and
        # a cached result stands in for a run while the code is unchanged;
        # the integration tests would then never reach this database.
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev

      - name: Test the photo conversion and build the worker with libvips
        # The rest of the tests run without it, as the api is built.
        run: |
          go test -count=1 -tags vips ./internal/utils/imaging/
          go build -tags vips -o /dev/null ./cmd/worker

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The job's own token may push too, while CR_PAT isn't set.
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push the api's image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the worker's image
        # Its own, with libvips; deploy.sh finds it by the api image's name.
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy the stack's files to the server
        # Into DEPLOY_PATH, /srv/maki. .env and backup.env stay on the server;
        # only their templates go.
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # The server's host key. Without it, the files go to whichever host
          # answers at SSH_HOST.
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          source: deploy/compose.yaml,deploy/Caddyfile,deploy/deploy.sh,deploy/backup.sh,deploy/.env.example,deploy/backup.env.example
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          # deploy.sh pulls this commit's image, applies its migrations while
          # the running api still serves, starts the api and the worker from
          # it, and waits until the api is ready. The image is public, so the
          # server pulls it without signing in.
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            sh deploy.sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker image prune -f
