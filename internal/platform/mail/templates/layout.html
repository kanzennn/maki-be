<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:24px 12px;background:#F4F4F4;font-family:Arial,Helvetica,sans-serif;color:#050505">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #EBEBEB;border-radius:12px">
<tr><td style="padding:32px 32px 8px;font-size:22px;font-weight:700;color:#BC3F0B">Maki</td></tr>
<tr><td style="padding:16px 32px 8px;font-size:15px;line-height:22px">
<p style="margin:0 0 16px">{{.Greeting}}</p>
{{range .Paragraphs}}<p style="margin:0 0 16px">{{.}}</p>
{{end}}{{if .Link}}<p style="margin:24px 0"><a href="{{.Link}}" style="display:inline-block;background:#BC3F0B;color:#FFFFFF;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:8px">{{.Action}}</a></p>
<p style="margin:0 0 16px;font-size:13px;line-height:18px;color:#6B6B6B">{{.LinkHint}}<br><a href="{{.Link}}" style="color:#BC3F0B;word-break:break-all">{{.Link}}</a></p>
{{end}}<p style="margin:24px 0 0">{{range $i, $line := .Signature}}{{if $i}}<br>{{end}}{{$line}}{{end}}</p>
</td></tr>
<tr><td style="padding:16px 32px 32px;font-size:12px;line-height:18px;color:#6B6B6B">{{.Footer}}</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
