# Live reload for `make dev`. The binary keeps the .exe suffix so the same
# config works on Windows and Linux.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  bin = "./tmp/api.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "docs", "api", "migrations", "sqlc", ".idea"]
  exclude_regex = ["_test\\.go$"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
