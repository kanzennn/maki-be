# The production stack on the VPS (spec, Infra & deploy): Caddy, serving the
# web app's files and passing the API to the api, behind the host's Nginx,
# which holds ports 80 and 443 and the certificate; and the api and the
# worker from the same maki-be image, on the server's shared PostgreSQL 18.
# It lives in /srv/maki beside its .env, and deploy.sh runs it: see
# docs/deployment.md.
#
# The image comes from release.env, which deploy.sh writes; the secrets and
# settings from .env, and the database's from the shared PostgreSQL's own
# file for this app (MAKI_DB_ENV_FILE); both stay on the server only.
name: maki

x-backend: &backend
  image: ${MAKI_BE_IMAGE:?deploy.sh sets it in release.env}
  restart: unless-stopped
  env_file:
    - .env
    # DB_HOST, DB_PORT, DB_DATABASE, DB_USERNAME, DB_PASSWORD: the config
    # makes the database's URL from them.
    - ${MAKI_DB_ENV_FILE:?set in .env}
  environment: &backend-env
    APP_ENV: production
    WEB_BASE_URL: https://${MAKI_DOMAIN:?set in .env}
    # Caddy reaches the api over the stack's network, and the shared
    # database's other clients could over db-net: X-Forwarded-For is taken
    # from private addresses only, none of them the internet's.
    TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
  networks: [default, db-net]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # The host's loopback only: the host's Nginx, which holds 80 and 443
      # and the certificate, passes the domain on to here.
      - "127.0.0.1:${MAKI_HTTP_PORT:?set in .env}:80"
    environment:
      CDN_ORIGIN: ${CDN_ORIGIN:-}
      STORAGE_ORIGIN: ${STORAGE_ORIGIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The web app's releases, current the one served (maki-fe's deploy).
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"

  worker:
    <<: *backend
    command: ["worker"]

  # pg_dump and pg_restore for backup.sh and the restore
  # (docs/deployment.md): the shared server's major version, on its network,
  # with this app's DB_ variables. Only ever run with `compose run`.
  pg:
    image: postgres:18
    profiles: [tools]
    env_file:
      - ${MAKI_DB_ENV_FILE:?set in .env}
    networks: [db-net]

networks:
  # The server's shared PostgreSQL 18 is on it.
  db-net:
    external: true
    name: ${MAKI_DB_NETWORK:-db-net}

volumes:
  caddy-data:
  caddy-config:
