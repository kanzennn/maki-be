# The production stack on the VPS (spec, Infra & deploy): Caddy in front,
# serving the web app's files and passing the API to the api; the api and
# the worker from the same maki-be image; and PostgreSQL. It lives in
# /srv/maki beside its .env, and deploy.sh runs it: see docs/deployment.md.
#
# The image comes from release.env, which deploy.sh writes; the secrets and
# settings from .env, which stays on the server only.
name: maki

x-backend: &backend
  image: ${MAKI_BE_IMAGE:?deploy.sh sets it in release.env}
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    APP_ENV: production
    DATABASE_URL: postgres://maki:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/maki?sslmode=disable
    WEB_BASE_URL: https://${MAKI_DOMAIN:?set in .env}
    # Only Caddy reaches the api: its port is published nowhere, so the
    # X-Forwarded-For of anything on the stack's private network is Caddy's.
    TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MAKI_DOMAIN: ${MAKI_DOMAIN:?set in .env}
      CDN_ORIGIN: ${CDN_ORIGIN:-}
      STORAGE_ORIGIN: ${STORAGE_ORIGIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The web app's releases, current the one served (maki-fe's deploy).
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    <<: *backend
    command: ["api"]
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"

  worker:
    <<: *backend
    command: ["worker"]

  postgres:
    # The production major version, which CI tests against (standard §12).
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: maki
      POSTGRES_DB: maki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maki -d maki"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
