        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createStaff
      tags: [user]
      summary: Create a Manager or staff account
      description: |
        Needs `user.manage`. A Manager account (`is_manager`) is the Owner's
