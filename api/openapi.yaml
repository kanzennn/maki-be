        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/VoucherNotFound"
        "409":
          $ref: "#/components/responses/VoucherCodeTaken"
        "422":
          $ref: "#/components/responses/VoucherRejected"
    delete:
      operationId: deleteVoucher
      tags: [voucher]
      summary: Delete a voucher no sale has used
      description: |
        The Owner only. The voucher disappears from every list, and its code
        is free again. A voucher a sale has used stays with the orders that
        name it (409 `voucher_used`): deactivate it instead. Recorded as
        `voucher.deleted`.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/VoucherNotFound"
        "409":
          description: A sale has used the voucher (`voucher_used`).
          content:
