        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          description: |
            Someone has this username, or had it before they were deleted
            (`username_taken`): a username is never used again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/StaffRejected"

  /api/v1/outlets/{oid}/users/{uid}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/UserID"
    get:
      operationId: getStaff
      tags: [user]
      summary: One of the outlet's users
      description: Needs `user.view`.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
    put:
      operationId: updateStaff
      tags: [user]
      summary: Change an account
      description: |
        Needs `user.manage`. Changes the name, email and phone, and the role
        or rank. The Owner promotes a staff member with `is_manager: true`,
        and makes a Manager staff again with `is_manager: false` and a
        `role_id`; either ends the user's sessions. An email changed here
