  /api/v1/outlets/{oid}/orders/{orid}/void:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/OrderID"
    post:
      operationId: voidOrder
      tags: [order]
      summary: Void an order
      description: |
        Needs `order.void`, and a reason. The order and its payment become
        `void`; nothing else of them changes. What it sold goes back to the
        stock of its menus still tracked, a void movement per menu; a
        deleted menu's stock stays as it is. Its voucher's use is given
        back, the voucher turned off since or not. Recorded as
        `order.voided`. An order is voided once (409 `order_already_void`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidOrderRequest"
      responses:
        "200":
          description: The order, void.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "409":
          $ref: "#/components/responses/OrderAlreadyVoid"
        "422":
          $ref: "#/components/responses/VoidRejected"

