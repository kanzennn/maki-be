      summary: Delete an area
      description: |
        Needs `table.manage`. Only an area that holds no table, deleted ones
        aside; its canvas goes with it, and its name is free again.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AreaNotFound"
        "409":
          description: |
            The area still holds tables (`area_not_empty`); `details.tables`
            counts them.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/outlets/{oid}/areas/{aid}/layout:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/AreaID"
    get:
      operationId: getLayout
      tags: [table]
      summary: An area's layout
      description: |
        Needs `table.view`. Its decorations, and its tables with their
        statuses now, placed or not.
      responses:
        "200":
          description: The layout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AreaNotFound"
    put:
      operationId: saveLayout
      tags: [table]
      summary: Save an area's whole layout
      description: |
        Needs `table.manage`. The editor saves the whole layout at once: the
        tables in `tables` placed in their boxes, the area's others off the
        layout, and its decorations. It saves on the version it opened; the
        layout as it is records nothing and keeps its version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutInput"
      responses:
        "200":
          description: The layout as saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Layout"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AreaNotFound"
        "409":
          description: |
            The layout or a table in the area changed since the editor
            opened it (`layout_changed`); `details.version` is the area's
            now. The editor reloads, then arranges it again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/LayoutRejected"

  /api/v1/outlets/{oid}/tables:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: listTables
      tags: [table]
      summary: The outlet's tables
      description: |
        Needs `table.view`. By area, in the areas' order, then by name as
        people read numbers ("Meja 2" before "Meja 10"), with their statuses
        now.
      parameters:
        - name: area_id
          in: query
          description: One area's tables.
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TableStatus"
        - name: q
          in: query
          description: Part of the name, in any case.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of tables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createTable
      tags: [table]
      summary: Create a table
      description: |
        Needs `table.manage`. It isn't placed on its area's layout yet; the
        area's layout version moves on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "201":
          description: The new table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          $ref: "#/components/responses/TableNameTaken"
        "422":
          $ref: "#/components/responses/TableRejected"

  /api/v1/outlets/{oid}/tables/{tid}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/TableID"
    get:
      operationId: getTable
      tags: [table]
      summary: One table
      description: Needs `table.view`.
      responses:
        "200":
          description: The table, with its status now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TableNotFound"
    put:
      operationId: updateTable
      tags: [table]
      summary: Change a table
      description: |
        Needs `table.manage`. A table moved to another area leaves its place
        on the old one's layout; both layouts' versions move on. A change of
        nothing records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TableInput"
      responses:
        "200":
          description: The table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TableNotFound"
        "409":
          $ref: "#/components/responses/TableNameTaken"
        "422":
          $ref: "#/components/responses/TableRejected"
    delete:
      operationId: deleteTable
      tags: [table]
      summary: Delete a table
      description: |
        Needs `table.manage`. Only a table nobody is seated at; a sale at it
        under way finishes first, and counts. Its name is free again.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TableNotFound"
        "409":
          description: Customers are seated at it (`table_occupied`); the cashier releases it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/outlets/{oid}/tables/{tid}/status:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/TableID"
    patch:
      operationId: setTableStatus
      tags: [table]
      summary: Turn a table on or off at the cashier
      description: |
        Needs `table.manage`. It stays on its layout either way; a table
        customers are seated at stays occupied until it is released.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveRequest"
      responses:
        "200":
          description: The table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TableNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/outlets/{oid}/tables/{tid}/release:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/TableID"
    post:
      operationId: releaseTable
      tags: [table]
      summary: Release a table its customers have left
      description: |
        Needs `checkout.create`. The sales before it no longer seat anyone
        there; a sale at it under way finishes first, and is released too.
        A table nobody is seated at stays as it is, and records nothing.
      responses:
        "200":
          description: The table, with its status now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/TableNotFound"

  /api/v1/outlets/{oid}/table-schedules:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: listTableSchedules
      tags: [table]
      summary: The outlet's table schedules
      description: Needs `table.view`. The latest first, past ones and cancelled ones included.
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ScheduleStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of schedules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createTableSchedule
      tags: [table]
      summary: Take tables out of service for a time
      description: |
        Needs `table.manage`. Its tables are `scheduled` from its start until
        its end. One that overlaps another schedule at a table is a warning
        (409 `schedule_overlaps`) until it is sent with `confirm_overlap`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: The new schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          $ref: "#/components/responses/ScheduleRefused"
        "422":
          $ref: "#/components/responses/ScheduleRejected"

  /api/v1/outlets/{oid}/table-schedules/{sid}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/ScheduleID"
    get:
      operationId: getTableSchedule
      tags: [table]
      summary: One schedule
      description: Needs `table.view`.
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
    put:
      operationId: updateTableSchedule
      tags: [table]
      summary: Change a schedule
      description: |
        Needs `table.manage`, and a schedule that isn't over. One under way
        keeps the start it has, past or not; overlaps are as for a new one.
        A change of nothing records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleRefused"
        "422":
          $ref: "#/components/responses/ScheduleRejected"
    delete:
      operationId: cancelTableSchedule
      tags: [table]
      summary: Cancel a schedule
      description: |
        Needs `table.manage`, and a schedule that isn't over. Its tables are
        back in service; it stays as a record, with who cancelled it.
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleRefused"

  /api/v1/outlets/{oid}/pos/tables:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: getPosTables
      tags: [table]
      summary: The cashier's floor
      description: |
        Needs `checkout.create`. The outlet's areas that hold tables, in
        order, with their decorations, and their tables with their statuses
        now; the cashier picks a table from it, and releases one. Where the
        outlet seats its customers by number stands (`dine_in_mode`
        `number`), `areas` is empty: there is no table to pick.
      responses:
        "200":
          description: The floor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Floor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"

  /api/v1/outlets/{oid}/dine-in-mode:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: getDineInMode
      tags: [table]
      summary: How the outlet seats its dine-in customers
      description: |
        Needs `table.view`; the Owner reads any outlet's. The cashier reads
        it in the catalog (`dine_in_mode`).
      responses:
        "200":
          description: The mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DineInModeSetting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
    put:
      operationId: setDineInMode
      tags: [table]
      summary: Choose how the outlet seats its dine-in customers
      description: |
        Needs `table.manage`. It holds from the outlet's next sale on: a sale
        under way finishes first, under the mode it began with. The orders
        taken keep their tables or their stands, and the areas and tables
        stay, for the table mode again. Saving the mode the outlet has
        changes and records nothing; a change is `dine_in_mode.updated` in
        the Log Action, with what it was. `mode` is `required` and `oneof`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DineInModeSetting"
      responses:
        "200":
          description: The mode, as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DineInModeSetting"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: maki_refresh
    # A cashier device's token, apart from the user signed in on it: a
    # browser's cookie, or the Android app's header.
    deviceCookie:
      type: apiKey
      in: cookie
      name: maki_device
    deviceToken:
      type: apiKey
      in: header
      name: X-Device-Token

  parameters:
    OutletID:
      name: oid
      in: path
      required: true
      schema:
        type: string
    RoleID:
      name: rid
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: uid
      in: path
      required: true
      schema:
        type: string
    CategoryID:
      name: cid
      in: path
      required: true
      schema:
        type: string
    DeviceID:
      name: did
      in: path
      required: true
      schema:
        type: string
    OrderID:
      name: orid
      in: path
      required: true
      schema:
        type: string
    MenuID:
      name: mid
      in: path
      required: true
      schema:
        type: string
    VoucherID:
      name: vid
      in: path
      required: true
      schema:
        type: string
    AreaID:
      name: aid
      in: path
      required: true
      schema:
        type: string
    TableID:
      name: tid
      in: path
      required: true
      schema:
        type: string
    ScheduleID:
      name: sid
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    Forbidden:
      description: The user lacks the permission this needs, or isn't the Owner (`forbidden`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OutletNotFound:
      description: |
        No such outlet, or one the user may not act in (`outlet_not_found`);
        the two look the same.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OutletCodeTaken:
      description: |
        Another outlet has this code, or had it before it was deleted
        (`outlet_code_taken`). Receipts print it, so it is never reused.
        Once the outlet has taken an order its code doesn't change at all
        (`outlet_code_locked`): every receipt number carries it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OutletRejected:
      description: |
        A field breaks a rule (`validation_failed`); `details.fields` maps
        each to the rule: `code` `format`; `name` `required` or `max`;
        `address`, `phone` `max`; `timezone` `timezone`; `locale` `oneof`;
        `open_time`, `close_time` `required` (one without the other),
        `format` or `different`; `tax_pct`, `service_pct` `range` or
        `decimals`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RoleNotFound:
      description: |
        No such role in the outlet (`role_not_found`), or an outlet the user
        may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RoleForbidden:
      description: |
        The caller lacks `role.manage` (`forbidden`), or the role would give
        a permission they don't hold (`permission_not_held`, with
        `details.permissions`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RoleNameTaken:
      description: Another role of the outlet has this name, in any case (`role_name_taken`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RoleRejected:
      description: |
        A field breaks a rule (`validation_failed`): `name` `required` or
        `max`; `description` `max`; `permissions` `oneof` for a code the
        catalog doesn't have.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UserNotFound:
      description: |
        No such user in the outlet (`user_not_found`), or an outlet the
        caller may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StaffForbidden:
      description: |
        Refused (403): no `user.manage` (`forbidden`); one's own account
        (`own_account`); a Manager account, or making one, by anyone but the
        Owner (`manager_account`); a staff account by the Owner, other than
        promoting it (`owner_manages_managers`); or a user or role holding a
        permission the caller lacks (`permission_not_held`, with
        `details.permissions`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StaffRejected:
      description: |
        A field breaks a rule (`validation_failed`): `name` `required` or
        `max`; `username` `format`; `email` `email`; `phone` `max`; `role_id`
        `required` (a staff account needs one) or `exists` (not a role of the
        outlet). A new password can break its own rules too:
        `password_too_short`, `password_too_long`, `password_same_as_username`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CategoryNotFound:
      description: |
        No such category in the outlet (`category_not_found`), or an outlet
        the caller may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CategoryNameTaken:
      description: Another category of the outlet has this name, in any case (`category_name_taken`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CategoryRejected:
      description: |
        A field breaks a rule (`validation_failed`): `name` `required` or
        `max`; `icon` `max` (more than 8 characters) or `format` (not an
        emoji: letters, spaces, or no pictograph at all, such as `??`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MenuNotFound:
      description: |
        No such menu in the outlet (`menu_not_found`), or an outlet the caller
        may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MenuSKUTaken:
      description: Another menu of the outlet has this SKU, in any case (`menu_sku_taken`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    MenuRejected:
      description: |
        A field breaks a rule (`validation_failed`): `name` `required` or
        `max`; `category_id` `required` or `exists` (not a category of the
        outlet); `price` `required` or `range`; `description` `max`; `sku`
        `format`; `initial_stock` `required` (tracking starts) or `range`;
        `stock_alert` `range`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StockRefused:
      description: |
        The count can't change this way: `stock_insufficient`, taking away
        more than there is (`details.available` is the count), or
        `stock_not_tracked`, a menu whose stock isn't tracked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StockNotTracked:
      description: The menu's stock isn't tracked, so it has no alert (`stock_not_tracked`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StockAdjustmentRejected:
      description: |
        A field breaks a rule (`validation_failed`): `type` `required` or
        `oneof`; `qty` `required` or `range`, also for an addition that would
        take the count past 1,000,000; `reason` `required` or `oneof`; `note`
        `max`, or `required` for the reason `other`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StockAlertRejected:
      description: The alert is below 0 or above 1,000,000 (`validation_failed`, `stock_alert` `range`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DeviceNotFound:
      description: |
        No such device in the outlet (`device_not_found`), or an outlet the
        caller may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DeviceActive:
      description: The device is the outlet's already, and in use (`device_already_active`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DeviceRejected:
      description: |
        A field breaks a rule (`validation_failed`): `name` `required` or
        `max` (50 characters); `platform` `required` or `oneof`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DeviceCantSell:
      description: |
        The user lacks `checkout.create` (`forbidden`), or the request comes
        from no device of the outlet's (`device_not_registered`: no device
        token, an unknown one, or another outlet's) or from a revoked one
        (`device_revoked`). `outlet_inactive`: the outlet was deactivated
        while the order was on its way.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OrderNotFound:
      description: |
        No such order in the outlet (`order_not_found`), or an outlet the
        caller may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OrderRefused:
      description: |
        The order can't be taken as it is: `order_id_conflict`,
        `order_no_taken`, `payment_method_unavailable`, `menu_unavailable`,
        `prices_changed`, `order_stock_insufficient`, a voucher's refusal
        (`voucher_not_for_outlet`, `voucher_inactive`, `voucher_expired`,
        `voucher_used_up`, `voucher_not_started`, `voucher_min_spend`),
        `dine_in_mode_changed`, `table_unavailable` or `total_changed`, as
        the operation describes.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OrderRejected:
      description: |
        A field breaks a rule (`validation_failed`); `details.fields` maps
        each to the rule, a line's by its path (`items.0.qty`):

        - `order_id` `required` or `format` (a CUID2);
        - `order_no` `required`, `format`, `prefix` (not this device's codes)
          or `date` (not the outlet's day of `client_created_at`);
        - `type` `required` or `oneof`;
        - `table_id` `dine_in` (a takeaway has no table);
        - `stand_number` `dine_in` (a takeaway has no stand), `with_table`
          (an order is at a table or at a stand) or `format` (1–10 letters,
          digits and hyphens, a hyphen only between them);
        - `client_created_at` `required`, or `range`: more than 5 minutes
          ahead of the server's clock, or more than a day behind;
        - `items` `required`, `max` (100 lines), or `range` (more than
          1,000,000,000 together);
        - `items.N.menu_id` `required` or `format`; `items.N.qty` `required`
          or `range` (1–999); `items.N.price` `required` or `range`
          (0–100,000,000); `items.N.note` `max` (100 characters);
        - `total` `required` or `range`;
        - `payment` `required`; `payment.method` `required` or `oneof`;
          `payment.received`, for cash, `required`, `range` (up to
          100,000,000,000) or `short` (less than `total`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    OrderAlreadyVoid:
      description: The order is void already (`order_already_void`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VoidRejected:
      description: The reason is missing or longer than 200 characters (`validation_failed`, `reason` `required` or `max`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VoucherNotFound:
      description: No such voucher, or a deleted one (`voucher_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VoucherCodeTaken:
      description: Another voucher has the code (`voucher_code_taken`). A deleted one's is free again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VoucherRejected:
      description: |
        A field breaks a rule (`validation_failed`); `details.fields` maps
        each to the rule:

        - `code` `required`, `format` (3–20 letters and digits), or `locked`
          (a used voucher's stays);
        - `name` `max` (100 characters);
        - `type` `required` or `oneof`, or `locked` (a used voucher's stays);
        - `value` `required` or `range` (a percentage 1–10000 basis points,
          an amount 1–1,000,000,000);
        - `max_discount` and `min_spend` `range` (1–1,000,000,000);
        - `quota` `required`, `range` (1–1,000,000), or `decrease` (a used
          voucher's only grows);
        - `expired_at` `required`, `after` (not after `start_at`), `future`
          (a new expiry that isn't in the future), or `earlier` (a used
          voucher's only moves later);
        - `all_outlets` `required`;
        - `outlet_ids` `required` (none, for a voucher not for every outlet)
          or `exists` (an outlet that doesn't exist, or was deleted).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    VoucherRefused:
      description: |
        The sale can't take the voucher: `voucher_not_for_outlet`, then by
        its status `voucher_inactive`, `voucher_expired`, `voucher_used_up`
        or `voucher_not_started`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AreaNotFound:
      description: |
        No such area in the outlet (`area_not_found`), or an outlet the
        caller may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AreaNameTaken:
      description: Another of the outlet's areas has the name, in any case (`area_name_taken`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    AreaRejected:
      description: |
        A field breaks a rule (`validation_failed`); `details.fields` maps
        each to the rule: `name` `required` or `max` (50 characters).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    LayoutRejected:
      description: |
        A field breaks a rule (`validation_failed`); `details.fields` maps
        each to the rule, by its path (`tables.0.x`, `decorations.2.kind`):

        - `version`, `tables` and `decorations` `required` (either list may
          be empty);
        - `tables.N.table_id` `required`, `duplicate`, or `exists` (not a
          table of this area);
        - `tables.N.x`, `.y`, `.w`, `.h` `required` or `range`: 2–16 cells a
          side, inside the grid;
        - `tables.N.rotation` `required` or `oneof` (0, 90, 180, 270);
          `tables.N.shape` `required` or `oneof`;
        - `tables.N` `overlap`: tables don't overlap each other;
        - `decorations` `max` (200); `decorations.N.kind` `required` or
          `oneof`; `decorations.N.x`, `.y`, `.w`, `.h` `required` or `range`
          (one cell up to the grid's size, inside it);
          `decorations.N.rotation` `required` or `oneof`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TableNotFound:
      description: |
        No such table in the outlet, or a deleted one (`table_not_found`),
        or an outlet the caller may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TableNameTaken:
      description: Another of the outlet's tables has the name, in any case (`table_name_taken`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TableRejected:
      description: |
        A field breaks a rule (`validation_failed`); `details.fields` maps
        each to the rule: `name` `required` or `max` (30 characters);
        `area_id` `required` or `exists` (not one of the outlet's areas);
        `capacity` `range` (1–99); `shape` `oneof`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ScheduleNotFound:
      description: |
        No such schedule in the outlet (`schedule_not_found`), or an outlet
        the caller may not act in (`outlet_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ScheduleRejected:
      description: |
        A field breaks a rule (`validation_failed`); `details.fields` maps
        each to the rule:

        - `title` `required` or `max` (100 characters);
        - `start_at` `required`, or `future`: a new or changed start before
          the current minute;
        - `end_at` `required`, `after` (not after `start_at`) or `future`
          (not in the future);
        - `table_ids` `required` (none), `max` (500), or `exists` (not a
          table of the outlet, or a deleted one).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ScheduleRefused:
      description: |
        `schedule_closed`: the schedule is finished or cancelled, so it no
        longer changes. `schedule_overlaps`: another schedule, neither
        cancelled nor finished, has some of the same tables out at a time
        this one crosses (one ending as the other starts doesn't);
        `details.schedules` lists each with its `schedule_id`, `title`,
        `start_at`, `end_at`, and the `tables` they share, by name. A
        warning: sent again with `confirm_overlap`, it is saved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    SaleNotFound:
      description: |
        An outlet the caller may not act in (`outlet_not_found`), or no
        voucher with the order's `voucher_code` (`voucher_not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InvalidRequest:
      description: The body isn't the JSON this endpoint takes (`invalid_request`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationFailed:
      description: |
        A field is missing or invalid (`validation_failed`).
        `details.fields` maps each field to the rule it broke.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PasswordRejected:
      description: |
        A field is missing or invalid (`validation_failed`), the current
        password is wrong (`wrong_password`), or the new password breaks a
        rule: `password_too_short` (`details.min`), `password_too_long`
        (`details.max`), `password_same_as_username`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: |
        No valid access token, or its session ended (`unauthorized`). Refresh
        once; if that fails too, sign the user out.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PasswordChangeRequired:
      description: The user must change their password first (`password_change_required`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many attempts (`rate_limited`). Wait `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok, ready]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable, machine-readable error code that clients switch on.
          examples: [stock_insufficient]
        message:
          type: string
          description: |
            Safe to show to the user, in the language of `Accept-Language`
            (Indonesian by default); a fallback when the client has no
            translation for `code`.
        details:
          type: object
          additionalProperties: true
          description: Machine-readable extra data, such as the remaining stock.
        request_id:
          type: string
          description: Matches the X-Request-ID response header and the server logs.

    LoginRequest:
      type: object
      required: [username, password, client]
      properties:
        username:
          type: string
          description: Compared without regard to case.
          examples: [kasir.bdg01]
        password:
          type: string
          format: password
        client:
          type: string
          enum: [web, mobile]
          description: Where the refresh token goes — a cookie for `web`, the body for `mobile`.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: The Android app's refresh token. The web app sends none; its cookie is used.
    Session:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds until the access token expires (900). Relative, so a wrong device clock doesn't matter.
          examples: [900]
        refresh_token:
          type: string
          description: "Only for `client: mobile`. Store it in secure storage; it replaces the previous one."
        refresh_expires_in:
          type: integer
          description: Only with `refresh_token`. Seconds until it expires if unused.
          examples: [2592000]
        user:
          $ref: "#/components/schemas/Me"
    Me:
      type: object
      required:
        - user_id
        - username
        - name
        - email
        - email_verified
        - pending_email
        - locale
        - language
        - is_owner
        - is_manager
        - outlet_id
        - must_change_password
        - permissions
        - outlet
      properties:
        user_id:
          type: string
          examples: [tz4a98xxat96iws9zmbrgj3a]
        username:
          type: string
        name:
          type: string
        email:
          type: [string, "null"]
          format: email
        email_verified:
          type: boolean
        pending_email:
          type: [string, "null"]
          format: email
          description: An address waiting to be confirmed, after `PUT /me/email`.
        locale:
          type: [string, "null"]
          description: The user's own language choice; `null` follows the outlet.
          examples: [en]
        language:
          type: string
          description: The language the user sees, after the fallbacks (own choice, outlet, `id`).
          examples: [id]
        is_owner:
          type: boolean
        is_manager:
          type: boolean
        outlet_id:
          type: [string, "null"]
          description: "`null` for the Owner."
        must_change_password:
          type: boolean
        permissions:
          type: array
          items:
            type: string
          description: >-
            What the user may do, sorted: in their outlet, or for the Owner in
            any outlet. Clients show what these allow; the server checks them
            on every request regardless.
          examples: [[checkout.create, menu.view]]
        outlet:
          description: "The user's outlet; `null` for the Owner."
          oneOf:
            - $ref: "#/components/schemas/OutletSummary"
            - type: "null"
    OutletSummary:
      type: object
      required: [outlet_id, code, name, timezone, locale]
      properties:
        outlet_id:
          type: string
        code:
          type: string
          examples: [BDG01]
        name:
          type: string
        timezone:
          type: string
          description: IANA name. Every time of the outlet shows in this zone.
          examples: [Asia/Jakarta]
        locale:
          type: string
          description: The outlet's default language.
          examples: [id]
    ListMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          description: Items across every page.
    ManagerRef:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: string
    Outlet:
      type: object
      required: [outlet_id, code, name, address, phone, timezone, locale, open_time, close_time,
                 tax_pct, service_pct, status, managers, created_at, updated_at]
      properties:
        outlet_id:
          type: string
        code:
          type: string
          description: Upper-case letters and digits, printed in receipt numbers.
          examples: [BDG01]
        name:
          type: string
        address:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        timezone:
          type: string
          description: IANA name. Every time of the outlet shows in this zone.
          examples: [Asia/Jakarta]
        locale:
          type: string
          description: The default language, for receipts and users who haven't chosen one.
          enum: [id, en]
        open_time:
          type: [string, "null"]
          description: "`HH:MM`; `null` together with `close_time` when no hours are set."
          examples: ["08:00"]
        close_time:
          type: [string, "null"]
          description: "`HH:MM`. Before `open_time` means past midnight."
          examples: ["22:00"]
        tax_pct:
          type: number
          description: Percentage, at most two decimals.
          examples: [11]
        service_pct:
          type: number
          examples: [5.5]
        status:
          type: string
          enum: [active, inactive]
        managers:
          type: array
          items:
            $ref: "#/components/schemas/ManagerRef"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OutletList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Outlet"
        meta:
          $ref: "#/components/schemas/ListMeta"
    OutletInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          description: 2 to 10 letters and digits; stored in upper case.
        name:
          type: string
          maxLength: 100
        address:
          type: [string, "null"]
          maxLength: 500
        phone:
          type: [string, "null"]
          maxLength: 32
        timezone:
          type: string
          description: IANA name; `Asia/Jakarta` when left out.
        locale:
          type: string
          enum: [id, en]
          description: "`id` when left out."
        open_time:
          type: [string, "null"]
          description: "`HH:MM`, with `close_time`, or both left out."
        close_time:
          type: [string, "null"]
        tax_pct:
          type: number
          minimum: 0
          maximum: 100
          default: 0
        service_pct:
          type: number
          minimum: 0
          maximum: 100
          default: 0
    OutletStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]
    DeleteOutletRequest:
      type: object
      required: [confirm_name]
      properties:
        confirm_name:
          type: string
          description: The outlet's name, typed again.
    PermissionGroup:
      type: object
      required: [module, permissions]
      properties:
        module:
          type: string
          examples: [menu]
        permissions:
          type: array
          items:
            type: string
          examples: [[menu.view, menu.manage, stock.adjust]]
    PermissionCatalog:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/PermissionGroup"
    Role:
      type: object
      required: [role_id, name, description, permissions, user_count, created_at, updated_at]
      properties:
        role_id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        permissions:
          type: array
          items:
            type: string
          description: Sorted.
        user_count:
          type: integer
          description: Users who hold the role.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoleUser:
      type: object
      required: [user_id, name, username]
      properties:
        user_id:
          type: string
        name:
          type: string
        username:
          type: string
    RoleDetail:
      description: >-
        A Role with the users who hold it. Written out rather than with
        allOf, which the Dart generator merges without the nullable fields.
      type: object
      required: [role_id, name, description, permissions, user_count, created_at, updated_at, users]
      properties:
        role_id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        permissions:
          type: array
          items:
            type: string
          description: Sorted.
        user_count:
          type: integer
          description: Users who hold the role.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        users:
          type: array
          items:
            $ref: "#/components/schemas/RoleUser"
    RoleList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        meta:
          $ref: "#/components/schemas/ListMeta"
    RoleInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        description:
          type: [string, "null"]
          maxLength: 200
        permissions:
          type: array
          items:
            type: string
          description: Codes from `GET /api/v1/permissions`.
    StaffRole:
      type: object
      required: [role_id, name]
      properties:
        role_id:
          type: string
        name:
          type: string
    Staff:
      type: object
      required: [user_id, name, username, email, phone, is_manager, role, status, must_change_password,
                 last_login_at, created_at, updated_at]
      properties:
        user_id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        is_manager:
          type: boolean
        role:
          description: "A staff member's role; `null` for a Manager."
          oneOf:
            - $ref: "#/components/schemas/StaffRole"
            - type: "null"
        status:
          type: string
          enum: [active, inactive]
        must_change_password:
          type: boolean
          description: The user hasn't replaced the password someone else gave them yet.
        last_login_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StaffList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Staff"
        meta:
          $ref: "#/components/schemas/ListMeta"
    CreateStaffRequest:
      type: object
      required: [name, username, password]
      properties:
        name:
          type: string
          maxLength: 100
        username:
          type: string
          description: 3 to 32 lowercase letters, digits, dots, dashes or underscores; stored in lower case.
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
          maxLength: 32
        password:
          type: string
          description: Temporary, 8 to 128 characters.
        role_id:
          type: [string, "null"]
          description: A role of the outlet; required unless `is_manager`.
        is_manager:
          type: boolean
          default: false
          description: A Manager account, which only the Owner creates.
    UpdateStaffRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
          maxLength: 32
        role_id:
          type: [string, "null"]
          description: Required unless `is_manager`.
        is_manager:
          type: boolean
          default: false
    StaffStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive]
    ResetStaffPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: The temporary password, 8 to 128 characters.
    Category:
      type: object
      required: [category_id, name, icon, sort_order, is_active, menu_count, created_at, updated_at]
      properties:
        category_id:
          type: string
        name:
          type: string
        icon:
          type: [string, "null"]
          description: An emoji, on the category's tile and on its menus until they have a photo.
          example: "🧋"
        sort_order:
          type: integer
          description: Its place in the cashier's order, from 0.
        is_active:
          type: boolean
          description: An inactive category and its menus are hidden at the cashier.
        menu_count:
          type: integer
          description: Menus in it, deleted ones aside.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategoryList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          $ref: "#/components/schemas/ListMeta"
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
        icon:
          type: [string, "null"]
          description: An emoji, up to 8 characters; no letters or spaces.
    CategoryOrderRequest:
      type: object
      required: [category_ids]
      properties:
        category_ids:
          type: array
          items:
            type: string
          description: Every category of the outlet, each once, in the new order.
    ActiveRequest:
      type: object
      required: [is_active]
      properties:
        is_active:
          type: boolean
    StockStatus:
      type: string
      enum: [untracked, ok, low, out]
      description: |
        `untracked`: always available. Tracked stock is `out` at 0 or below,
        `low` above 0 and at or below `stock_alert`, `ok` otherwise; an alert
        of 0 or none is off.
    MenuCategory:
      type: object
      required: [category_id, name, icon, is_active]
      properties:
        category_id:
          type: string
        name:
          type: string
        icon:
          type: [string, "null"]
        is_active:
          type: boolean
    Menu:
      type: object
      required: [menu_id, name, description, sku, price, image_url, track_stock, stock_qty, stock_alert,
                 stock_status, is_active, category, created_at, updated_at]
      properties:
        menu_id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        sku:
          type: [string, "null"]
        price:
          type: integer
          format: int64
          description: Rupiah.
          example: 18000
        image_url:
          type: [string, "null"]
          description: The photo on the CDN; null until photos arrive, and for a menu without one.
        track_stock:
          type: boolean
        stock_qty:
          type: integer
          description: The count, for a tracked menu.
        stock_alert:
          type: [integer, "null"]
          description: At or below it, stock is low; null or 0 is off.
        stock_status:
          $ref: "#/components/schemas/StockStatus"
        is_active:
          type: boolean
          description: An inactive menu is hidden at the cashier.
        category:
          $ref: "#/components/schemas/MenuCategory"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MenuList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Menu"
        meta:
          $ref: "#/components/schemas/ListMeta"
    MenuInput:
      type: object
      required: [name, category_id, price]
      properties:
        name:
          type: string
          maxLength: 100
        category_id:
          type: string
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000
          description: Rupiah.
        description:
          type: [string, "null"]
          maxLength: 500
        sku:
          type: [string, "null"]
          description: Up to 32 letters, digits, dots, dashes or underscores; unique in the outlet.
        track_stock:
          type: boolean
          default: false
        initial_stock:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: The count tracking starts from; counts only then.
        stock_alert:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: Ignored for an untracked menu.
        is_active:
          type: [boolean, "null"]
          description: For a new menu (active when left out); PATCH …/status changes an existing one's.
    StockAdjustmentInput:
      type: object
      required: [type, qty, reason]
      properties:
        type:
          type: string
          enum: [in, out, set]
          description: "`in` adds, `out` takes away, `set` is a stock take: the count found."
        qty:
          type: integer
          minimum: 0
          maximum: 1000000
          description: The amount to add or take away (at least 1), or the count found.
        reason:
          type: string
          enum: [restock, damaged, correction, other]
          description: "`damaged` is damaged or spoiled; `other` says what in `note`."
        note:
          type: [string, "null"]
          maxLength: 200
          description: Required for the reason `other`. Shown as typed, never translated.
    StockAlertRequest:
      type: object
      properties:
        stock_alert:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
          description: At or below it, stock is low; null or 0 turns the alert off.
    StockMovementUser:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: string
    StockMovement:
      type: object
      required: [stock_movement_id, type, qty_change, stock_after, reason, note, user, order_id, created_at]
      properties:
        stock_movement_id:
          type: string
        type:
          type: string
          enum: [initial, in, out, set, sale, void]
          description: |
            `initial`: the count tracking started from; `in`, `out`, `set`: an
            adjustment; `sale`, `void`: the cashier's, with their order.
        qty_change:
          type: integer
          description: The change to the count, new minus old; 0 for a stock take that matched.
          example: -3
        stock_after:
          type: integer
          description: The count it left.
        reason:
          type: [string, "null"]
          enum: [initial, restock, damaged, correction, other, null]
          description: An adjustment's reason, or `initial`; null for a sale or void.
        note:
          type: [string, "null"]
        user:
          $ref: "#/components/schemas/StockMovementUser"
        order_id:
          type: [string, "null"]
          description: The order of a sale or void.
        created_at:
          type: string
          format: date-time
    StockMovementList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/StockMovement"
        meta:
          $ref: "#/components/schemas/ListMeta"
    DevicePerson:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: string
    Device:
      type: object
      required: [device_id, code, name, platform, status, activated_by, activated_at, last_seen_at, revoked_at, revoked_by]
      properties:
        device_id:
          type: string
        code:
          type: string
          description: In every receipt number the device makes, after the outlet's code.
          example: K01
        name:
          type: string
          example: Kasir depan
        platform:
          type: string
          enum: [web, android]
        status:
          type: string
          enum: [active, revoked]
        activated_by:
          $ref: "#/components/schemas/DevicePerson"
        activated_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: When the device last sold, or started the cashier.
        revoked_at:
          type: [string, "null"]
          format: date-time
        revoked_by:
          oneOf:
            - $ref: "#/components/schemas/DevicePerson"
            - type: "null"
    DeviceList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Device"
        meta:
          $ref: "#/components/schemas/ListMeta"
    ActivateDeviceRequest:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
          maxLength: 50
          example: Kasir depan
        platform:
          type: string
          enum: [web, android]
          description: "`web` gets its token as a cookie, `android` in the body."
    ActivatedDevice:
      type: object
      required: [device, token]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        token:
          type: [string, "null"]
          description: The Android app's device token, its one copy; null for a browser, which gets the cookie.
    PosCatalog:
      type: object
      required: [outlet, payment_methods, dine_in_mode, categories, menus]
      properties:
        outlet:
          $ref: "#/components/schemas/PosOutlet"
        payment_methods:
          type: array
          description: The methods the cashier offers, in order.
          items:
            $ref: "#/components/schemas/PaymentMethod"
        dine_in_mode:
          $ref: "#/components/schemas/DineInMode"
        categories:
          type: array
          description: The active categories holding one of the menus, in the cashier's order.
          items:
            $ref: "#/components/schemas/PosCategory"
        menus:
          type: array
          description: In the cashier's order.
          items:
            $ref: "#/components/schemas/PosMenu"
    PosOutlet:
      type: object
      required: [outlet_id, code, name, address, phone, timezone, locale, tax_bps, service_bps]
      properties:
        outlet_id:
          type: string
        code:
          type: string
          example: BDG01
        name:
          type: string
        address:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        timezone:
          type: string
          description: Every time the cashier shows, and its receipt numbers' day, is in this zone.
          example: Asia/Jakarta
        locale:
          type: string
          description: The receipt's language.
          enum: [id, en]
        tax_bps:
          type: integer
          description: Basis points, so the cashier's totals are exact integers, as the server's are; 1000 is 10%.
          minimum: 0
          maximum: 10000
        service_bps:
          type: integer
          minimum: 0
          maximum: 10000
    PaymentMethod:
      type: string
      enum: [cash, qris, debit]
    PosCategory:
      type: object
      required: [category_id, name, icon, item_count]
      properties:
        category_id:
          type: string
        name:
          type: string
        icon:
          type: [string, "null"]
        item_count:
          type: integer
          description: How many of the catalog's menus it holds.
    PosMenu:
      type: object
      required: [menu_id, category_id, name, description, sku, price, image_url, track_stock, stock_qty,
                 stock_alert, stock_status]
      properties:
        menu_id:
          type: string
        category_id:
          type: string
        name:
          type: string
        description:
          type: [string, "null"]
        sku:
          type: [string, "null"]
        price:
          type: integer
          format: int64
          description: Rupiah.
        image_url:
          type: [string, "null"]
          description: The photo's address, with the upload milestone; null until then.
        track_stock:
          type: boolean
        stock_qty:
          type: [integer, "null"]
          description: The count, the most one order may take; null when the stock isn't tracked, always available.
        stock_alert:
          type: [integer, "null"]
        stock_status:
          $ref: "#/components/schemas/StockStatus"
    PosDevice:
      type: object
      required: [device, order_no_prefix, day, next_number]
      properties:
        device:
          $ref: "#/components/schemas/PosDeviceInfo"
        order_no_prefix:
          type: string
          description: The outlet's code and the device's, which start each of its receipt numbers.
          example: BDG01-K01
        day:
          type: string
          format: date
          description: Today in the outlet's time zone.
        next_number:
          type: integer
          minimum: 1
          description: The count the device's next receipt number today takes.
    PosDeviceInfo:
      type: object
      required: [device_id, code, name, platform]
      properties:
        device_id:
          type: string
        code:
          type: string
          example: K01
        name:
          type: string
        platform:
          type: string
          enum: [web, android]
    CreateOrderRequest:
      type: object
      required: [order_id, order_no, type, client_created_at, items, total, payment]
      properties:
        order_id:
          type: string
          description: Made by the device, a CUID2; the order's idempotency key.
        order_no:
          type: string
          example: BDG01-K01-20261001-0001
        type:
          $ref: "#/components/schemas/OrderType"
        table_id:
          type: [string, "null"]
          maxLength: 64
          description: The table a dine-in order seats its customers at; null or blank for none, as it may be.
        stand_number:
          type: [string, "null"]
          maxLength: 64
          description: |
            The number on the stand a dine-in customer took, where the outlet
            seats them by number stands: 1–10 letters, digits and hyphens, a
            hyphen only between them, kept in capitals. Null or blank for
            none.
          example: B-3
        client_created_at:
          type: string
          format: date-time
          description: When the device made the order.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CreateOrderItem"
        voucher_code:
          type: [string, "null"]
          maxLength: 64
          description: The voucher the customer gave, in any case; one per order. Null or blank for none.
        total:
          type: integer
          format: int64
          description: What the cashier charged, which must be the server's total.
        payment:
          $ref: "#/components/schemas/CreateOrderPayment"
    CreateOrderItem:
      type: object
      required: [menu_id, qty, price]
      properties:
        menu_id:
          type: string
        qty:
          type: integer
          minimum: 1
          maximum: 999
        price:
          type: integer
          format: int64
          description: The menu's price, as the cashier showed it.
        note:
          type: [string, "null"]
          maxLength: 100
          example: less sugar
    CreateOrderPayment:
      type: object
      required: [method]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        received:
          type: [integer, "null"]
          format: int64
          description: Cash, what the customer handed over, at least the total; the other methods have none.
    OrderType:
      type: string
      enum: [dine_in, takeaway]
    OrderStatus:
      type: string
      enum: [paid, void]
    OrderPerson:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: string
    Order:
      type: object
      required: [order_id, order_no, device_id, type, table_id, table_name, stand_number, status, cashier, items,
                 subtotal, voucher_code, voucher_discount, service_bps, service, tax_bps, tax, total, payment,
                 client_created_at, created_at, voided_at, voided_by, void_reason]
      properties:
        order_id:
          type: string
        order_no:
          type: string
          example: BDG01-K01-20261001-0001
        device_id:
          type: string
        type:
          $ref: "#/components/schemas/OrderType"
        table_id:
          type: [string, "null"]
          description: The table a dine-in sale seated its customers at; null for none.
        table_name:
          type: [string, "null"]
          description: The table's name as it was then, for the receipt; null for none.
          example: A1
        stand_number:
          type: [string, "null"]
          description: The number on the stand a dine-in customer took, where a waiter brings the order; null for none.
          example: "12"
        status:
          $ref: "#/components/schemas/OrderStatus"
        cashier:
          $ref: "#/components/schemas/OrderPerson"
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: integer
          format: int64
        voucher_code:
          type: [string, "null"]
          description: The code of the voucher the sale used, as it was then, for the receipt; null for none.
          example: MERDEKA17
        voucher_discount:
          type: integer
          format: int64
        service_bps:
          type: integer
          description: The rate the order was charged at.
        service:
          type: integer
          format: int64
        tax_bps:
          type: integer
        tax:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        payment:
          $ref: "#/components/schemas/OrderPayment"
        client_created_at:
          type: string
          format: date-time
          description: When the device made it.
        created_at:
          type: string
          format: date-time
          description: When the server took it.
        voided_at:
          type: [string, "null"]
          format: date-time
        voided_by:
          oneOf:
            - $ref: "#/components/schemas/OrderPerson"
            - type: "null"
        void_reason:
          type: [string, "null"]
    OrderItem:
      type: object
      required: [order_item_id, menu_id, menu_name, price, qty, note, line_total]
      properties:
        order_item_id:
          type: string
        menu_id:
          type: string
        menu_name:
          type: string
          description: The menu's name at the sale.
        price:
          type: integer
          format: int64
          description: The menu's price at the sale.
        qty:
          type: integer
        note:
          type: [string, "null"]
        line_total:
          type: integer
          format: int64
    OrderPayment:
      type: object
      required: [method, amount, received, change, status]
      properties:
        method:
          $ref: "#/components/schemas/PaymentMethod"
        amount:
          type: integer
          format: int64
        received:
          type: [integer, "null"]
          format: int64
        change:
          type: [integer, "null"]
          format: int64
        status:
          $ref: "#/components/schemas/OrderStatus"
    OrderSummary:
      type: object
      required: [order_id, order_no, device_id, type, table_name, stand_number, status, total, item_count,
                 payment_method, cashier, client_created_at, created_at]
      properties:
        order_id:
          type: string
        order_no:
          type: string
        device_id:
          type: string
        type:
          $ref: "#/components/schemas/OrderType"
        table_name:
          type: [string, "null"]
          description: The table's name as it was at the sale; null for none.
        stand_number:
          type: [string, "null"]
          description: The number on the customer's stand; null for none.
        status:
          $ref: "#/components/schemas/OrderStatus"
        total:
          type: integer
          format: int64
        item_count:
          type: integer
          description: Every line's qty, together.
        payment_method:
          $ref: "#/components/schemas/PaymentMethod"
        cashier:
          $ref: "#/components/schemas/OrderPerson"
        client_created_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    OrderList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        meta:
          $ref: "#/components/schemas/ListMeta"
    VoidOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 200
    VoucherStatus:
      type: string
      enum: [active, scheduled, used_up, expired, inactive]
      description: |
        At the moment the voucher is read, in this order: `inactive`, turned
        off; `expired`, at or past `expired_at`; `used_up`, every use taken;
        `scheduled`, before `start_at`; else `active`.
    VoucherType:
      type: string
      enum: [percent, amount]
      description: |
        `percent`: `value` is basis points of the subtotal (1000 is 10%),
        rounded to the nearest rupiah, half up, then held to `max_discount`;
        `amount`: `value` is rupiah. Either way the discount is never past
        the subtotal, and comes off it before the service charge and the
        tax. `api/test-vectors/voucher-discounts.json` holds worked cases.
    VoucherInput:
      type: object
      required: [code, type, value, quota, expired_at, all_outlets]
      properties:
        code:
          type: string
          description: 3–20 letters and digits, kept in capitals; unique among the vouchers not deleted.
          example: MERDEKA17
        name:
          type: [string, "null"]
          maxLength: 100
        type:
          $ref: "#/components/schemas/VoucherType"
        value:
          type: integer
          format: int64
          description: Basis points for a percentage (1–10000), rupiah for an amount (1–1,000,000,000).
        max_discount:
          type: [integer, "null"]
          format: int64
          description: A percentage's most, in rupiah; dropped for an amount.
        min_spend:
          type: [integer, "null"]
          format: int64
          description: The subtotal the voucher needs, in rupiah.
        quota:
          type: integer
          minimum: 1
          maximum: 1000000
          description: How many sales may use it, in every outlet together.
        start_at:
          type: [string, "null"]
          format: date-time
          description: When it starts, to the second; null starts at once.
        expired_at:
          type: string
          format: date-time
          description: When it stops, to the second; after `start_at`.
        all_outlets:
          type: boolean
          description: Every outlet, those still to come too; else the ones in `outlet_ids`.
        outlet_ids:
          type: array
          maxItems: 1000
          items:
            type: string
          description: The outlets it is for when it isn't for all of them; ignored when it is.
        is_active:
          type: [boolean, "null"]
          description: A new voucher's status, active when left out; ignored by PUT.
    VoucherOutlet:
      type: object
      required: [outlet_id, code, name]
      properties:
        outlet_id:
          type: string
        code:
          type: string
        name:
          type: string
    Voucher:
      type: object
      required: [voucher_id, code, name, type, value, max_discount, min_spend, quota, used_count, start_at,
                 expired_at, all_outlets, outlets, is_active, status, first_used_at, created_at, updated_at]
      properties:
        voucher_id:
          type: string
        code:
          type: string
          example: MERDEKA17
        name:
          type: [string, "null"]
        type:
          $ref: "#/components/schemas/VoucherType"
        value:
          type: integer
          format: int64
        max_discount:
          type: [integer, "null"]
          format: int64
        min_spend:
          type: [integer, "null"]
          format: int64
        quota:
          type: integer
        used_count:
          type: integer
          description: The uses taken; a void gives its sale's back.
        start_at:
          type: [string, "null"]
          format: date-time
        expired_at:
          type: string
          format: date-time
        all_outlets:
          type: boolean
        outlets:
          type: array
          items:
            $ref: "#/components/schemas/VoucherOutlet"
          description: |
            The outlets it is for, by name, none when it is for all of them.
            Deleted outlets sell nothing and don't show; an outlet's Manager
            sees only theirs.
        is_active:
          type: boolean
        status:
          $ref: "#/components/schemas/VoucherStatus"
        first_used_at:
          type: [string, "null"]
          format: date-time
          description: When a sale first used it, voided since or not; from then on PUT keeps its code and type, and it can't be deleted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VoucherList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Voucher"
        meta:
          $ref: "#/components/schemas/ListMeta"
    VoucherRedemption:
      type: object
      required: [order_id, order_no, outlet, client_created_at, voucher_discount, status]
      properties:
        order_id:
          type: string
        order_no:
          type: string
          example: BDG01-K01-20261001-0001
        outlet:
          $ref: "#/components/schemas/VoucherOutlet"
        client_created_at:
          type: string
          format: date-time
          description: When the cashier charged it.
        voucher_discount:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/OrderStatus"
    VoucherRedemptionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VoucherRedemption"
        meta:
          $ref: "#/components/schemas/ListMeta"
    ValidateVoucherRequest:
      type: object
      required: [code, subtotal]
      properties:
        code:
          type: string
          description: As the customer gave it, in any case.
        subtotal:
          type: integer
          format: int64
          description: The cart's lines together, before any discount.
    VoucherTerms:
      type: object
      required: [voucher_id, code, name, type, value, max_discount, min_spend]
      properties:
        voucher_id:
          type: string
        code:
          type: string
        name:
          type: [string, "null"]
        type:
          $ref: "#/components/schemas/VoucherType"
        value:
          type: integer
          format: int64
        max_discount:
          type: [integer, "null"]
          format: int64
        min_spend:
          type: [integer, "null"]
          format: int64
    VoucherQuote:
      type: object
      required: [voucher, discount, applies]
      properties:
        voucher:
          $ref: "#/components/schemas/VoucherTerms"
        discount:
          type: integer
          format: int64
          description: The discount on `subtotal`; 0 while it doesn't apply.
        applies:
          type: boolean
          description: False while `subtotal` is short of `min_spend`.
          example: Salah input
    Area:
      type: object
      required: [area_id, name, sort_order, table_count, created_at, updated_at]
      properties:
        area_id:
          type: string
        name:
          type: string
        sort_order:
          type: integer
          description: Its place in the order, from 0.
        table_count:
          type: integer
          description: Tables in it, placed on its layout or not.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AreaList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Area"
        meta:
          $ref: "#/components/schemas/ListMeta"
    AreaInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
    AreaOrderRequest:
      type: object
      required: [area_ids]
      properties:
        area_ids:
          type: array
          items:
            type: string
          description: Every area of the outlet, each once, in the new order.
    AreaRef:
      type: object
      required: [area_id, name]
      properties:
        area_id:
          type: string
        name:
          type: string
    Box:
      type: object
      description: |
        A place on an area's grid of 48 × 32 cells: the top left cell, and
        the cells across and down.
      required: [x, y, w, h]
      properties:
        x:
          type: integer
          minimum: 0
        y:
          type: integer
          minimum: 0
        w:
          type: integer
          minimum: 1
        h:
          type: integer
          minimum: 1
    Rotation:
      type: integer
      enum: [0, 90, 180, 270]
      description: How a drawing turns inside its box; a quarter turn also swaps the box's width and height.
    TableShape:
      type: string
      enum: [square, round, rectangle]
    DineInMode:
      type: string
      enum: [table, number]
      description: |
        How the outlet seats its dine-in customers, one way at a time:
        `table`, at the tables of its layout, which the cashier may pick (an
        outlet that never chose sits them so); `number`, wherever they set
        down the number stand the cashier gave them, where a waiter brings
        the order. There a dine-in sale carries its stand's number, and no
        table.
    DineInModeSetting:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/DineInMode"
    TableStatus:
      type: string
      enum: [available, occupied, inactive, scheduled]
      description: |
        Worked out when read, in this order: `occupied` while customers are
        seated, `inactive` (turned off), `scheduled` (a schedule under way
        has it out of service), `available`. The cashier seats an order at
        an available or an occupied table.
    Seated:
      type: object
      description: The customers seated at a table.
      required: [since, orders]
      properties:
        since:
          type: string
          format: date-time
          description: When the sale that seated them was taken.
        orders:
          type: integer
          description: Sales at the table since.
    Table:
      type: object
      required: [table_id, area, name, capacity, shape, box, rotation, is_active, status, seated, created_at,
                 updated_at]
      properties:
        table_id:
          type: string
        area:
          $ref: "#/components/schemas/AreaRef"
        name:
          type: string
          example: A1
        capacity:
          type: [integer, "null"]
          description: Seats; null when not given.
        shape:
          $ref: "#/components/schemas/TableShape"
        box:
          description: Its place on its area's layout; null while it isn't placed.
          oneOf:
            - $ref: "#/components/schemas/Box"
            - type: "null"
        rotation:
          $ref: "#/components/schemas/Rotation"
        is_active:
          type: boolean
        status:
          $ref: "#/components/schemas/TableStatus"
        seated:
          description: Who is seated there, while the status is `occupied`; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Seated"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TableList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Table"
        meta:
          $ref: "#/components/schemas/ListMeta"
    TableInput:
      type: object
      required: [name, area_id]
      properties:
        name:
          type: string
          maxLength: 30
        area_id:
          type: string
          description: A table moved to another area leaves its place on the old one's layout.
        capacity:
          type: [integer, "null"]
          minimum: 1
          maximum: 99
        shape:
          $ref: "#/components/schemas/TableShape"
        is_active:
          type: boolean
          description: For a new table, active when left out; an existing one changes it with `PATCH …/status`.
    DecorationKind:
      type: string
      enum: [wall, cashier, door]
    Decoration:
      type: object
      description: A marker on an area's canvas that isn't a table.
      required: [kind, x, y, w, h, rotation]
      properties:
        kind:
          $ref: "#/components/schemas/DecorationKind"
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        rotation:
          $ref: "#/components/schemas/Rotation"
    Layout:
      type: object
      required: [area, version, decorations, tables]
      properties:
        area:
          $ref: "#/components/schemas/AreaRef"
        version:
          type: integer
          description: |
            Goes up with each change to the layout or to a table in the area;
            the editor saves on the one it opened.
        decorations:
          type: array
          items:
            $ref: "#/components/schemas/Decoration"
        tables:
          type: array
          description: Every table in the area, placed or not, by name.
          items:
            $ref: "#/components/schemas/Table"
    Placement:
      type: object
      required: [table_id, x, y, w, h, rotation, shape]
      properties:
        table_id:
          type: string
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer
        rotation:
          $ref: "#/components/schemas/Rotation"
        shape:
          $ref: "#/components/schemas/TableShape"
    LayoutInput:
      type: object
      required: [version, tables, decorations]
      properties:
        version:
          type: integer
          description: The layout's version as the editor opened it.
        tables:
          type: array
          maxItems: 1000
          description: The tables placed on it; the area's others come off it.
          items:
            $ref: "#/components/schemas/Placement"
        decorations:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Decoration"
    ScheduleStatus:
      type: string
      enum: [upcoming, ongoing, finished, cancelled]
    ScheduleTable:
      type: object
      required: [table_id, name, area, deleted]
      properties:
        table_id:
          type: string
        name:
          type: string
        area:
          $ref: "#/components/schemas/AreaRef"
        deleted:
          type: boolean
          description: Whether the table was deleted since.
    UserRef:
      type: object
      required: [user_id, name]
      properties:
        user_id:
          type: string
        name:
          type: string
    Schedule:
      type: object
      required: [schedule_id, title, start_at, end_at, status, tables, created_by, cancelled_at, cancelled_by,
                 created_at, updated_at]
      properties:
        schedule_id:
          type: string
        title:
          type: string
          example: Acara kantor
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/ScheduleStatus"
        tables:
          type: array
          description: By area, then by name.
          items:
            $ref: "#/components/schemas/ScheduleTable"
        created_by:
          $ref: "#/components/schemas/UserRef"
        cancelled_at:
          type: [string, "null"]
          format: date-time
        cancelled_by:
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScheduleList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        meta:
          $ref: "#/components/schemas/ListMeta"
    ScheduleInput:
      type: object
      required: [title, start_at, end_at, table_ids]
      properties:
        title:
          type: string
          maxLength: 100
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        table_ids:
          type: array
          maxItems: 500
          items:
            type: string
        confirm_overlap:
          type: boolean
          description: Saves the schedule though another has some of its tables out at the same time.
    Floor:
      type: object
      required: [areas]
      properties:
        areas:
          type: array
          description: The outlet's areas that hold tables, in order.
          items:
            $ref: "#/components/schemas/FloorArea"
    FloorArea:
      type: object
      required: [area_id, name, decorations, tables]
      properties:
        area_id:
          type: string
        name:
          type: string
        decorations:
          type: array
          items:
            $ref: "#/components/schemas/Decoration"
        tables:
          type: array
          description: By name, placed or not.
          items:
            $ref: "#/components/schemas/FloorTable"
    FloorTable:
      type: object
      required: [table_id, name, capacity, shape, box, rotation, status, seated]
      properties:
        table_id:
          type: string
        name:
          type: string
        capacity:
          type: [integer, "null"]
        shape:
          $ref: "#/components/schemas/TableShape"
        box:
          description: Its place on its area's layout; null while it isn't placed.
          oneOf:
            - $ref: "#/components/schemas/Box"
            - type: "null"
        rotation:
          $ref: "#/components/schemas/Rotation"
        status:
          $ref: "#/components/schemas/TableStatus"
        seated:
          oneOf:
            - $ref: "#/components/schemas/Seated"
            - type: "null"
    UpdateMeRequest:
      type: object
      required: [locale]
      properties:
        locale:
          type: [string, "null"]
          enum: [id, en, null]
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    ForgotPasswordRequest:
      type: object
      required: [login]
      properties:
        login:
          type: string
          description: Username or email address.
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ChangeEmailRequest:
      type: object
      required: [email, current_password]
      properties:
        email:
          type: string
          format: email
        current_password:
          type: string
          format: password

security:
  - accessToken: []
