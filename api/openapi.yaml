  /api/v1/outlets/{oid}/menus:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: listMenus
      tags: [menu]
      summary: The outlet's menus
      description: |
        Needs `menu.view`. In the cashier's order: by the categories' order,
        then by name. Deleted menus never show.
      parameters:
        - name: q
          in: query
          description: Part of the name or the SKU, in any case.
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: stock
          in: query
          description: The stock condition (`stock_status`).
          schema:
            $ref: "#/components/schemas/StockStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of menus.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createMenu
      tags: [menu]
      summary: Create a menu
      description: |
        Needs `menu.manage`. A tracked menu (`track_stock`) starts from
        `initial_stock`, its first stock movement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuInput"
      responses:
        "201":
          description: The new menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          $ref: "#/components/responses/MenuSKUTaken"
        "422":
          $ref: "#/components/responses/MenuRejected"

  /api/v1/outlets/{oid}/menus/{mid}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/MenuID"
    get:
      operationId: getMenu
      tags: [menu]
      summary: One menu
      description: Needs `menu.view`.
      responses:
        "200":
          description: The menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MenuNotFound"
    put:
      operationId: updateMenu
      tags: [menu]
      summary: Change a menu
      description: |
        Needs `menu.manage`. Every field but the stock count and the status
        (`is_active` is ignored here). A price change leaves past sales as
        they were. Turning `track_stock` on needs `initial_stock`, the count it
        starts from; once tracked, the count only changes through stock
        adjustments. Turning it off keeps the count and its history, unused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuInput"
      responses:
        "200":
          description: The changed menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "409":
          $ref: "#/components/responses/MenuSKUTaken"
        "422":
          $ref: "#/components/responses/MenuRejected"
    delete:
      operationId: deleteMenu
      tags: [menu]
      summary: Delete a menu
      description: |
        Needs `menu.manage`. Past sales keep its name and price; its SKU is free
        again.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MenuNotFound"

  /api/v1/outlets/{oid}/menus/{mid}/status:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/MenuID"
    patch:
      operationId: setMenuStatus
      tags: [menu]
      summary: Show or hide a menu at the cashier
      description: |
        Needs `menu.manage`. An inactive menu is hidden at the cashier; it stays
        in the admin area and the reports.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveRequest"
      responses:
        "200":
          description: The menu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/outlets/{oid}/menus/{mid}/stock-adjustments:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/MenuID"
    post:
      operationId: adjustStock
      tags: [menu]
      summary: Add, take away or count a menu's stock
      description: |
        Needs `stock.adjust`, on a tracked menu. `in` adds `qty` and `out`
        takes it away (1 to 1,000,000 at once); `set` is a stock take, the
        count found (0 to 1,000,000), recorded even when it matches. The count
        never goes below zero this way, nor above 1,000,000.

        The menu is locked while its count changes, so adjustments made
        together each start from the count the one before left: none is lost.
        Each is a stock movement and a Log Action entry (`stock.adjusted`,
        with the count before and after, the type, the reason and the note).
        Answers with the menu as the adjustment left it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentInput"
      responses:
        "200":
          description: The menu, with its new count and condition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "409":
          $ref: "#/components/responses/StockRefused"
        "422":
          $ref: "#/components/responses/StockAdjustmentRejected"

  /api/v1/outlets/{oid}/menus/{mid}/stock-alert:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/MenuID"
    put:
      operationId: setStockAlert
      tags: [menu]
      summary: Set a menu's stock alert
      description: |
        Needs `stock.adjust` or `menu.manage` (the alert is a field of the
        menu form too), on a tracked menu. At or below the alert, stock is
        `low`; null or 0 turns the alert off. The count stays as it is. A
        change is a `menu.updated` Log Action entry; the alert the menu
        already has records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAlertRequest"
      responses:
        "200":
          description: The menu, with its alert and condition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "409":
          $ref: "#/components/responses/StockNotTracked"
        "422":
          $ref: "#/components/responses/StockAlertRejected"

  /api/v1/outlets/{oid}/menus/{mid}/stock-movements:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/MenuID"
    get:
      operationId: listStockMovements
      tags: [menu]
      summary: A menu's stock history
      description: |
        Needs `menu.view`. Newest first, in the order the count changed in,
        each naming who made it (a deleted account keeps its name here). A
        menu whose tracking was turned off keeps its history; its count adds
        up to the history's `qty_change`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of the history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/MenuNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/outlets/{oid}/devices:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: listDevices
      tags: [device]
      summary: The outlet's cashier devices
      description: |
        The outlet's Manager, or the Owner. Those in use first, then the
        revoked, each by code.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: activateDevice
      tags: [device]
      summary: Make this device one of the outlet's cashiers
      description: |
        Sent from the device itself, by the outlet's Manager signed in on it;
        not the Owner, who runs no till. The device gets the next code (`K01`,
        `K02`, …, never used again, since it is in the receipt numbers it
        makes) and a token only it holds:

        - a browser (`platform: web`) as the `maki_device` cookie: `HttpOnly`,
          `SameSite=Strict`, 400 days, and sent again each time the cashier
          starts, so a device in use keeps it;
        - the Android app (`platform: android`) in the body, to keep in its
          secure storage and send as `X-Device-Token`.

        A request whose device is the outlet's already, and in use, is 409
        `device_already_active`. Recorded as `device.activated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateDeviceRequest"
      responses:
        "201":
          description: The device, and the app's token.
          headers:
            Set-Cookie:
              description: "`maki_device`, for `platform: web`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivatedDevice"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          $ref: "#/components/responses/DeviceActive"
        "422":
          $ref: "#/components/responses/DeviceRejected"

  /api/v1/outlets/{oid}/devices/{did}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/DeviceID"
    delete:
      operationId: revokeDevice
      tags: [device]
      summary: Revoke a device
      description: |
        The outlet's Manager, or the Owner. The device can't sell from then
        on; a sale it has in progress finishes first. Revoking a revoked
        device changes nothing. Recorded as `device.revoked`.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/DeviceNotFound"

  /api/v1/outlets/{oid}/pos/catalog:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: getPosCatalog
      tags: [order]
      summary: Everything the cashier sells from
      description: |
        Needs `checkout.create`. In one answer, so a device can later keep it
        offline whole: the outlet for the receipt, with its rates; the
        payment methods it takes; and its menus in the cashier's order, with
        the categories that hold them.

        The menus are the active menus of active categories. Those that can
        be sold come first, out of stock last; within each, by the
        categories' order, then name. Inactive and deleted menus aren't
        there at all. The stock is as it is now: the cashier loads the
        catalog again after each sale, and now and then.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"

  /api/v1/outlets/{oid}/pos/device:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: getPosDevice
      tags: [order]
      summary: The device the cashier runs on, and its receipt numbers today
      description: |
        Needs `checkout.create`, from one of the outlet's devices in use:
        sent as the cashier starts. Marks the device seen, and sends a
        browser's `maki_device` cookie again, so a device in use keeps it.

        The device makes each receipt number itself:
        `order_no_prefix-YYYYMMDD-NNNN`, with the outlet's day and the
        device's count that day, at least four digits. `next_number` is the
        count its next one today takes; a new day starts it at 1. The
        cashier asks again after `order_no_taken`.
      security:
        - accessToken: []
          deviceCookie: []
        - accessToken: []
          deviceToken: []
      responses:
        "200":
          description: The device.
          headers:
            Set-Cookie:
              description: "`maki_device` again, for a browser."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PosDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/DeviceCantSell"
        "404":
          $ref: "#/components/responses/OutletNotFound"

  /api/v1/outlets/{oid}/orders:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: listOrders
      tags: [order]
      summary: Today's orders
      description: |
        Needs `checkout.create` or `order.void`. The outlet's orders made
        today, in its time zone, newest first, voided ones included. `q`
        narrows them to the receipt numbers holding it, in any case.
      parameters:
        - name: q
          in: query
          description: Part of a receipt number.
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of today's orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createOrder
      tags: [order]
      summary: Take an order the cashier charged for
      description: |
        Needs `checkout.create`, from one of the outlet's devices in use.
        The device makes the order's ID (a CUID2) and its receipt number, so
        the ID is the order's idempotency key: sending the same order again,
        as after a lost answer, answers 200 with the order as it was taken,
        never a second one, even from a device revoked since. The same ID
        with anything else in it, or from another outlet, is 409
        `order_id_conflict`.

        Everything is checked in one transaction, against the outlet as it
        is when the order arrives:

        - the receipt number is the device's (`order_no_prefix` of
          `GET …/pos/device`), carries the outlet's day of
          `client_created_at`, and isn't taken (409 `order_no_taken`: the
          cashier asks for the next number and sends the order again);
        - the payment method is on (409 `payment_method_unavailable`);
        - each menu is on sale (409 `menu_unavailable`, `details.menus` its
          IDs), at the price the cashier showed (409 `prices_changed`,
          `details.menus` each `menu_id` with its `price`), with stock enough
          for its lines together (409 `order_stock_insufficient`,
          `details.menus` each `menu_id` with what is `available`);
        - the voucher, when `voucher_code` names one, is for the sale, as
          `POST …/vouchers/validate` checks it (404 `voucher_not_found`, 409
          `voucher_not_for_outlet`, `voucher_inactive`, `voucher_expired`,
          `voucher_used_up`, `voucher_not_started`), and the subtotal
          reaches its minimum spend (409 `voucher_min_spend`,
          `details.min_spend`): the cashier takes it off and says why;
        - the order fits how the outlet seats its dine-in customers now
          (`dine_in_mode`): where they sit at tables, no `stand_number`;
          where they take number stands, no `table_id`, and a dine-in order
          carries its stand's `stand_number` (409 `dine_in_mode_changed`,
          `details.mode` the outlet's). The Manager changed it since the
          catalog was loaded: the cashier loads it again, takes the table or
          the number off, and says why;
        - the table, when `table_id` names one (dine-in only), can be sat at:
          the outlet's, not deleted, and available or occupied (409
          `table_unavailable`, `details.status` the table's, `inactive` or
          `scheduled`, or `missing`): the cashier takes it off and says why;
        - `total` is the server's, from those prices, the voucher's terms
          and the outlet's rates (409 `total_changed`, `details.total` the
          server's): subtotal, less the voucher's discount, then the service
          charge on that, then the tax on both, each rounded to the nearest
          rupiah, half up. `api/test-vectors/order-totals.json` and
          `voucher-discounts.json` hold worked cases.

        The menus are locked in the order of their IDs, so two cashiers
        selling the last one at once sell it once; then the voucher, so two
        outlets taking its last use at once take it once; then the outlet's
        dine-in mode, shared, so a change of it waits for the sale; then the
        table, shared with other sales at it, so a change, a release or a
        delete of it waits for the sale. Then the order, with its voucher's
        code and its table's name as they are and its stand's number, its
        lines with the menus' names and prices as they are, and its payment
        are saved; tracked stock goes
        down, a sale movement per menu; the voucher's use is taken; and the
        Log Action records `order.created`. Cash gives change from
        `received`.
      security:
        - accessToken: []
          deviceCookie: []
        - accessToken: []
          deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: The order taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: The order as it was taken, for a resend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/DeviceCantSell"
        "404":
          $ref: "#/components/responses/SaleNotFound"
        "409":
          $ref: "#/components/responses/OrderRefused"
        "422":
          $ref: "#/components/responses/OrderRejected"

  /api/v1/outlets/{oid}/orders/{orid}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/OrderID"
    get:
      operationId: getOrder
      tags: [order]
      summary: An order, with its lines and payment
      description: |
        Needs `checkout.create` or `order.void`. For the receipt, printed
        again, and the void.
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
