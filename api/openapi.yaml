          $ref: "#/components/responses/VoucherNotFound"
    put:
      operationId: updateVoucher
      tags: [voucher]
      summary: Change a voucher
      description: |
        The Owner only. Every field but the status (`is_active` here is
        ignored). Before a sale has used the voucher everything may change;
        once one has (`first_used_at`), voided since or not, its code and
        type stay, its quota only grows and its expiry only moves later. A
        new expiry is in the future either way. Recorded as
        `voucher.updated`, with the fields that changed; a change of nothing
        records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherInput"
      responses:
        "200":
          description: The changed voucher.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
