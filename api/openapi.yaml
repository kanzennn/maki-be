        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/CategoryNotFound"
        "409":
          $ref: "#/components/responses/CategoryNameTaken"
        "422":
          $ref: "#/components/responses/CategoryRejected"
    delete:
