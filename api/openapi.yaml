openapi: 3.1.0
info:
  title: Maki API
  version: 0.2.0
  description: |
    Contract for the Maki POS backend. This file is the single source of truth:
    maki-fe and maki-mobile generate their API types from it, so update it in
    the same commit as the handler change.

    Business endpoints live under `/api/v1`. Errors always use the
    `ErrorEnvelope` schema; clients switch on `error.code`, never on `message`.

    `error.message` is written in the language of the `Accept-Language`
    request header — Indonesian (`id`, the default) or English (`en`) — and
    the response's `Content-Language` header names the one used. Clients show
    their own translation of `code` when they have one, and fall back to
    `message`.

    **Signing in.** `POST /api/v1/auth/login` returns a 15-minute access token,
    sent as `Authorization: Bearer <token>`, and a refresh token that lasts 30
    days from its last use. The web app gets the refresh token as an
    `HttpOnly` cookie that page scripts can't read; the Android app gets it in
    the response body and keeps it in secure storage. Each refresh replaces
    the refresh token; presenting one that was already replaced signs that
    session out everywhere.

    **Access.** Every signed-in user has a set of `permissions` (see
    `GET /api/v1/me`). An endpoint under `/api/v1/outlets/{oid}/` first checks
    that the user may act in that outlet — the Owner in any outlet, everyone
    else only in their own — and answers 404 `outlet_not_found` otherwise,
    the same as for an outlet that doesn't exist. It then checks the
    permission the endpoint names, 403 `forbidden` without it. Endpoints for
    the Owner alone answer 403 `forbidden` to anyone else.

    **Lists** take `?page=` (from 1) and `?page_size=` (1–100, 20 by default)
    and answer `{"data": [...], "meta": {"page", "page_size", "total"}}`.

    **Rate limits.** Sign-in, password reset and email verification answer
    429 `rate_limited` when hit too often, per IP address and per account,
    with a `Retry-After` header and `details.retry_after` in seconds.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes (public, outside /api/v1)
  - name: auth
    description: Signing in and out, sessions, password reset, email verification
  - name: me
    description: The signed-in user's own account
  - name: outlet
    description: The business's outlets, for the Owner alone
  - name: role
    description: An outlet's custom roles and the permissions they hold
  - name: user
    description: |
      An outlet's Manager and staff accounts. The Owner manages Manager
      accounts and promotes staff; Managers, and staff with `user.manage`,
      manage staff. Nobody manages their own account here, and nobody
      manages a user who holds a permission they lack, or gives a role that
      holds one.
  - name: menu
    description: |
      An outlet's menu: its categories, its menus and their stock. `menu.view`
      reads it, `menu.manage` changes categories and menus, `stock.adjust`
      counts stock. The Owner reads every outlet's menu and changes none.
  - name: device
    description: |
      An outlet's cashier devices. The outlet's Manager activates one on the
      device itself; from then on it proves itself with a token only it
      holds (`maki_device` cookie in a browser, `X-Device-Token` from the
      app). The Manager and the Owner list and revoke them.
  - name: order
    description: |
      The cashier: its catalog, the orders it takes, and voids. Selling
      needs `checkout.create` and one of the outlet's devices in use; the
      orders are for whoever sells (`checkout.create`) or voids
      (`order.void`). The Owner runs no till.

      An online sale is charged with the figures on the cashier's screen,
      so the server takes it only while they are still right, and otherwise
      answers 409 naming what changed (`prices_changed`,
      `menu_unavailable`, `order_stock_insufficient`, `total_changed`): the
      cashier reloads the catalog and shows the new figures before charging
      again.

      A sale may name a voucher (`voucher_code`), which it takes a use of;
      a void gives the use back. A dine-in sale may name its table
      (`table_id`), which it seats its customers at.
  - name: voucher
    description: |
      The Owner's discount vouchers: a percentage or an amount off an
      order's subtotal, for every outlet or some, a number of uses in every
      outlet together, and a period. The Owner manages them; an outlet's
      Manager lists the ones its cashier can take; the cashier checks a
      code before charging (`checkout.create`). Times are absolute; the
      admin shows them in WIB.
  - name: table
    description: |
      An outlet's dining areas, their tables and layouts, and the schedules
      that take tables out of service. `table.view` reads them, which the
      Owner does too; `table.manage` changes them. The cashier
      (`checkout.create`) reads the floor and releases a table its
      customers have left.

      Each area has a canvas of 48 × 32 grid cells; a table, and a
      decoration (a wall, the cashier, a door), is a box on it. A table's
      status is worked out when it is read, in this order: `occupied`
      while customers are seated (a dine-in sale there since it was last
      released and since the outlet last opened or closed: an outlet
      without hours, since midnight in its zone), `inactive`, `scheduled`
      (a schedule under way has it out of service), or `available`. The
      cashier seats an order at an available or an occupied table.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [health]
      summary: Liveness probe
      description: Reports that the process is up. Never touches dependencies.
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      operationId: getReadyz
      tags: [health]
      summary: Readiness probe
      description: Reports whether the database answers within two seconds.
      responses:
        "200":
          description: The service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: The database is unavailable (`not_ready`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username and password
      description: |
        Starts a session. With `client: web` the refresh token comes as the
        `maki_refresh` cookie (HttpOnly, SameSite=Strict, path
        `/api/v1/auth`); with `client: mobile` it comes in the body.

        A user whose password was set by someone else can sign in, but has
        `must_change_password: true` and gets 403 `password_change_required`
        from every endpoint except `GET /me` and `PUT /me/password` until
        they change it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: "`maki_refresh` for `client: web`."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Wrong username or password (`invalid_credentials`). The same for an unknown username.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: The password is right but the account is deactivated (`account_disabled`), or its outlet is deactivated or deleted (`outlet_inactive`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange the refresh token for a new access token
      description: |
        The web app sends no body: the browser sends the `maki_refresh`
        cookie, and the new refresh token comes back as the cookie. The
        Android app sends `refresh_token` and gets the new one in the body.
        Either way the old refresh token stops working.
      security:
        - refreshCookie: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new access token, a new refresh token, and the user.
          headers:
            Set-Cookie:
              description: The new `maki_refresh`, when the old one came as a cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: |
            The refresh token is missing, unknown, expired or revoked, or was
            already replaced (`unauthorized`). Sign the user out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: |
            Another request refreshed this session a moment ago
            (`refresh_superseded`), e.g. from a second browser tab. Retry once:
            the browser already holds the new cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out of this session
      description: |
        Ends the session named by the refresh token (the cookie, or
        `refresh_token` in the body) or else by the access token, and clears
        the cookie. Always succeeds, so it is safe to call twice.
      security:
        - refreshCookie: []
        - accessToken: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Signed out.

  /api/v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Ask for a password reset link
      description: |
        Only the Owner resets their own password this way; Managers and staff
        are reset by the Owner or their Manager. If `login` is the Owner's
        username or verified email, a link valid for 30 minutes is emailed.
        The answer is the same whether or not that happened, so it reveals
        nothing about which accounts exist.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Accepted. A link is on its way if the account can reset by email.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password/reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Choose a new password with the emailed link's token
      description: |
        The token comes from the link's URL fragment (`#token=…`). On success
        every session of the account is signed out and a notice is emailed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password is changed. Sign in with it.
        "400":
          description: |
            The request is malformed (`invalid_request`), or the token is
            unknown, used or expired (`token_invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/PasswordRejected"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/email/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Confirm an email address with the emailed link's token
      description: |
        The token comes from the link's URL fragment (`#token=…`). The new
        address replaces the old one only now.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: The address is confirmed.
        "400":
          description: |
            The request is malformed (`invalid_request`), or the token is
            unknown, used or expired (`token_invalid`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/me:
    get:
      operationId: getMe
      tags: [me]
      summary: The signed-in user
      description: Open even while the password must be changed.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [me]
      summary: Change the signed-in user's own settings
      description: |
        `locale` sets the user's language on every device; `null` follows the
        outlet's language.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/me/password:
    put:
      operationId: changePassword
      tags: [me]
      summary: Change the signed-in user's password
      description: |
        Needs the current password. Every other session of the account is
        signed out; this one stays. Clears `must_change_password`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/PasswordRejected"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/me/email:
    put:
      operationId: changeEmail
      tags: [me]
      summary: Start changing the signed-in user's email address
      description: |
        Needs the current password. Emails a confirmation link (valid 24
        hours) to the new address and a notice to the current one. The
        current address stays in use until the new one is confirmed with
        `POST /api/v1/auth/email/verify`; `Me.pending_email` shows it until
        then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "202":
          description: The confirmation link is on its way.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "422":
          description: |
            A field is invalid (`validation_failed`), the current password is
            wrong (`wrong_password`), or the address is already the account's
            (`email_unchanged`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/outlets:
    get:
      operationId: listOutlets
      tags: [outlet]
      summary: List the outlets
      description: The Owner only. Sorted by name; deleted outlets never show.
      parameters:
        - name: q
          in: query
          description: Part of the name or the code, in any case.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of outlets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutletList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createOutlet
      tags: [outlet]
      summary: Create an outlet
      description: |
        The Owner only. The outlet starts active, with a cashier role
        (`checkout.create`) named in its language for its Manager to start
        from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletInput"
      responses:
        "201":
          description: The new outlet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/OutletCodeTaken"
        "422":
          $ref: "#/components/responses/OutletRejected"

  /api/v1/outlets/{oid}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: getOutlet
      tags: [outlet]
      summary: One outlet
      description: The Owner only.
      responses:
        "200":
          description: The outlet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
    put:
      operationId: updateOutlet
      tags: [outlet]
      summary: Change an outlet
      description: The Owner only. Every field but the status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletInput"
      responses:
        "200":
          description: The changed outlet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          $ref: "#/components/responses/OutletCodeTaken"
        "422":
          $ref: "#/components/responses/OutletRejected"
    delete:
      operationId: deleteOutlet
      tags: [outlet]
      summary: Delete a deactivated outlet
      description: |
        The Owner only. `confirm_name` must repeat the outlet's name. The
        outlet disappears from every list; its data stays, and its code is
        never used again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteOutletRequest"
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          description: The outlet is still active (`outlet_active`); deactivate it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: |
            `confirm_name` isn't the outlet's name (`outlet_name_mismatch`),
            or is missing (`validation_failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/outlets/{oid}/status:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    patch:
      operationId: setOutletStatus
      tags: [outlet]
      summary: Activate or deactivate an outlet
      description: |
        The Owner only. While an outlet is inactive its users can't sign in,
        and their sessions end at their next request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutletStatusRequest"
      responses:
        "200":
          description: The outlet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outlet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"

  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags: [role]
      summary: Every permission, grouped by module
      description: The catalog a role's checklist shows. Any signed-in user.
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/outlets/{oid}/roles:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: listRoles
      tags: [role]
      summary: The outlet's roles
      description: |
        Needs `role.view`, or `user.view`: whoever sees the outlet's users
        filters them by role, and gives one when managing them. Sorted by
        name.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
    post:
      operationId: createRole
      tags: [role]
      summary: Create a role
      description: |
        Needs `role.manage`. The role may only hold permissions the caller
        holds themselves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: The new role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RoleForbidden"
        "404":
          $ref: "#/components/responses/OutletNotFound"
        "409":
          $ref: "#/components/responses/RoleNameTaken"
        "422":
          $ref: "#/components/responses/RoleRejected"

  /api/v1/outlets/{oid}/roles/{rid}:
    parameters:
      - $ref: "#/components/parameters/OutletID"
      - $ref: "#/components/parameters/RoleID"
    get:
      operationId: getRole
      tags: [role]
      summary: One role, with the users who hold it
      description: Needs `role.view`.
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoleNotFound"
    put:
      operationId: updateRole
      tags: [role]
      summary: Change a role
      description: |
        Needs `role.manage`. Permissions the change adds must be the
        caller's own; it may keep or drop ones the caller lacks. The role's
        users get the new permissions from their next request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: The changed role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/RoleForbidden"
        "404":
          $ref: "#/components/responses/RoleNotFound"
        "409":
          $ref: "#/components/responses/RoleNameTaken"
        "422":
          $ref: "#/components/responses/RoleRejected"
    delete:
      operationId: deleteRole
      tags: [role]
      summary: Delete a role nobody holds
      description: Needs `role.manage`.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/RoleNotFound"
        "409":
          description: |
            Users still hold the role (`role_in_use`); `details.users` lists
            them as `{user_id, name}` so they can be moved first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /api/v1/outlets/{oid}/users:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    get:
      operationId: listStaff
      tags: [user]
      summary: The outlet's users
      description: Needs `user.view`. Sorted by name; deleted users never show.
      parameters:
        - name: q
          in: query
          description: Part of the name or the username, in any case.
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: role_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: A page of users.
