  /api/v1/vouchers/{vid}:
    parameters:
      - $ref: "#/components/parameters/VoucherID"
    get:
      operationId: getVoucher
      tags: [voucher]
      summary: One voucher
      description: The Owner only.
      responses:
        "200":
          description: The voucher.
