  /api/v1/outlets/{oid}/vouchers/validate:
    parameters:
      - $ref: "#/components/parameters/OutletID"
    post:
      operationId: validateVoucher
      tags: [voucher]
      summary: Check the code a customer gave
      description: |
        Needs `checkout.create`, from one of the outlet's devices in use, as
        a sale does, so codes can't be tried from anywhere. Takes nothing:
        the sale takes its use, when it is saved.

        Answers the voucher's terms, for the cashier to work its discount
        out again as the cart changes, and its discount on `subtotal` now.
        `applies` is false while `subtotal` is short of `min_spend`: the
        cart may still grow, and the cashier holds the payment until it
        does. A voucher the sale can't take is refused, first for an outlet
        it isn't for, then by its status.
      security:
        - accessToken: []
          deviceCookie: []
        - accessToken: []
          deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateVoucherRequest"
      responses:
        "200":
          description: The voucher, and its discount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherQuote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/DeviceCantSell"
        "404":
          description: |
            No voucher with this code (`voucher_not_found`), or an outlet the
            caller may not act in (`outlet_not_found`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          $ref: "#/components/responses/VoucherRefused"
        "422":
          description: |
            A field breaks a rule (`validation_failed`): `code` `required`;
            `subtotal` `required` or `range` (0–1,000,000,000).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

